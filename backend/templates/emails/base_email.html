<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0;padding:0;background:#0B0B0B;font-family:Helvetica,Arial,sans-serif;color:#F5F5F5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0B0B0B;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">
          <tr>
            <td style="padding:24px 0;text-align:center;">
              <span style="font-size:28px;letter-spacing:8px;font-weight:700;color:#F5F5F5;">SKIWAA</span><br />
              <span style="font-size:10px;letter-spacing:4px;color:#888888;text-transform:uppercase;">Wear Your Energy</span>
            </td>
          </tr>
          <tr>
            <td style="background:#111111;border:1px solid rgba(255,255,255,0.08);padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 0;text-align:center;font-size:11px;color:#666666;letter-spacing:1px;">
              © SKIWAA · Minimal · Bold · Timeless<br />
              <a href="{{ frontend_url }}" style="color:#C1121F;text-decoration:none;">skiwaa.in</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
