{% extends "emails/base_email.html" %}
{% block content %}
<h1 style="margin:0 0 16px;font-size:24px;letter-spacing:2px;color:#F5F5F5;">VERIFY YOUR EMAIL</h1>
<p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#BBBBBB;">
  Hey {{ name }}, confirm this email address to activate your SKIWAA account.
</p>
<a href="{{ link }}"
   style="display:inline-block;background:#C1121F;color:#FFFFFF;padding:14px 32px;font-size:12px;letter-spacing:3px;text-decoration:none;text-transform:uppercase;">
  Verify Email
</a>
<p style="margin:24px 0 0;font-size:12px;color:#666666;">
  If the button doesn't work, paste this link into your browser:<br />
  <a href="{{ link }}" style="color:#C1121F;word-break:break-all;">{{ link }}</a>
</p>
{% endblock %}
